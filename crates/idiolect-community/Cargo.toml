[package]
name = "idiolect-community"
description = "Community workspaces, governed change packets, migration operations, signed releases, federation, and portable exports for idiolect."
readme = "README.md"
categories = ["data-structures", "config"]
keywords = ["atproto", "community", "governance", "migration", "schema"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
panproto-protocols = { workspace = true }
panproto-schema = { workspace = true }
panproto-check = { workspace = true }
panproto-lens = { workspace = true }
panproto-expr = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
toml = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"
