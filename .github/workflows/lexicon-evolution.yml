name: lexicon-evolution

# Produce compatibility and optic-classification evidence whenever an
# idiolect-owned Lexicon changes. The gate uses Panproto's released v0.74.4
# commands; authored-chain verification and publication remain explicit
# follow-up steps for changes that need them.

on:
  pull_request:
    paths:
      - "lexicons/dev/idiolect/**"
      - "scripts/lexicon-evolve.sh"
      - ".github/workflows/lexicon-evolution.yml"
  push:
    branches: [main]
    paths:
      - "lexicons/dev/idiolect/**"

permissions:
  contents: read

env:
  PANPROTO_VERSION: "0.74.4"

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Panproto CLI
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/panproto-cli-installer.sh"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/panproto/panproto/releases/download/v${PANPROTO_VERSION}/panproto-cli-installer.sh" \
            -o "$installer"
          sh "$installer"
          schema --version

      - name: Identify changed lexicons
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'lexicons/dev/idiolect/*.json')
          {
            echo "base=$base"
            echo "lexicons<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run evolution gate per changed lexicon
        if: steps.changed.outputs.lexicons != ''
        env:
          BASE_SHA: ${{ steps.changed.outputs.base }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            nsid=$(echo "$path" | sed -E 's|lexicons/||; s|/|.|g; s|\.json$||')
            echo "::group::$nsid"
            old_path="$RUNNER_TEMP/${nsid}.old.json"
            if ! git show "$BASE_SHA:$path" > "$old_path" 2>/dev/null; then
              echo "New Lexicon: no prior revision to compare."
              echo "::endgroup::"
              continue
            fi
            OUTPUT_DIR="$GITHUB_WORKSPACE/evolution-artifacts/$nsid" \
              scripts/lexicon-evolve.sh "$nsid" "$old_path" "$path"
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.lexicons }}"

      - name: Upload evolution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lexicon-evolution-${{ github.sha }}
          path: evolution-artifacts/**
          if-no-files-found: ignore
