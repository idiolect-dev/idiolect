# Scheduled supply-chain audit.
#
# Runs daily at 09:00 UTC and on-demand via workflow_dispatch. Never
# runs on PRs or pushes — the intent is "new vulnerability disclosed
# between releases," not "per-commit gate" (that's `cargo-deny` in
# ci.yml).
#
# A failing job is the action item. The workflow has read-only repository
# access and does not open or update issues.

name: audit

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: audit Rust dependencies
        # RUSTSEC-2026-0253 reaches the lockfile only through
        # atrium-common's wasm32-only lru dependency. Idiolect's supported
        # and cargo-deny target matrix is native; deny.toml records the same
        # bounded exception with its removal condition.
        run: cargo audit --ignore RUSTSEC-2026-0253

  cargo-deny-advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: check Rust advisories
        # Feature and target selection, including bounded advisory
        # exceptions, lives in deny.toml.
        run: cargo deny --locked check advisories

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.2"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: audit
        # `bun audit` surfaces npm advisories. Non-zero exit records the
        # audit finding without obscuring the Rust audit results.
        run: bun audit
        continue-on-error: true
